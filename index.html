<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo – App de programação de eventos científicos</title>
<style>
:root{
  --bg:#f3f4f7;--surface:#ffffff;--ink:#151a22;--muted:#586172;--line:#e1e5ec;--stage:#dfe3ea;
  --danger:#b3261e;--dangerbg:#fdeceb;--ok:#17703f;--okbg:#e6f5ec;--warn:#8a5300;--warnbg:#fff2d3;
  --p:#1E5AA8;--pt:#ffffff;--sec:#DCE8F8;--acc:#F2A900;--acct:#111111;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0f1319;--surface:#181d26;--ink:#eef1f6;--muted:#a1abba;--line:#2a313d;--stage:#080a0e;
  --danger:#ff8f86;--dangerbg:#3b1b19;--ok:#6fd49b;--okbg:#14301f;--warn:#ffcf70;--warnbg:#3a2c0c;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--stage);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{height:100%}
.stage{height:100%;display:flex}
.guide{display:none}
.main{flex:1;min-width:0;display:flex;align-items:stretch;justify-content:center}
.ic{flex:none;vertical-align:middle}
.link{color:color-mix(in srgb,var(--p) 72%,var(--ink));font-weight:600;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}

/* ---------- Guia do protótipo (desktop) ---------- */
@media (min-width:900px){
  .guide{display:block;width:320px;flex:none;padding:22px 20px;overflow:auto;background:var(--surface);border-right:1px solid var(--line)}
  .main{align-items:center;padding:18px;overflow:auto}
  .fab{display:none!important}
}
.guide h2{font-size:18px;margin-bottom:4px}
.guide .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.guide h3{font-size:14px;margin:18px 0 8px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.guide ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.guide li{margin-bottom:4px}
.fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;width:48px;height:48px;border-radius:50%;border:0;background:#151a22;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}

/* ---------- Moldura do celular ---------- */
.shell{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.phone{width:100%;height:100%}
@media (min-width:900px){
  .phone{width:390px;height:min(820px,100%);border-radius:36px;border:9px solid #0a0c10;box-shadow:0 18px 50px rgba(0,0,0,.35)}
}
.hdr{flex:none;display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 14px;background:var(--p);color:var(--pt)}
.hdr .ttl{flex:1;min-width:0}
.hdr .ttl b{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl small{display:block;font-size:12px;opacity:.85}
.ibtn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:inherit;display:inline-flex;align-items:center;justify-content:center;flex:none}
.hdr .ibtn{background:color-mix(in srgb,var(--pt) 16%,transparent)}
.view{flex:1;min-height:0;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.foot{flex:none;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}
.tabbar{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;position:relative;min-height:60px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600}
.tab.on{color:color-mix(in srgb,var(--p) 75%,var(--ink))}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--p)}
.tab .bdg{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--acct);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---------- Elementos ---------- */
.logo{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;flex:none;object-fit:contain;background:#fff}
.mono{font-weight:800;letter-spacing:.02em;border:2px solid currentColor}
.h1{font-size:24px;line-height:1.2;margin-bottom:6px}
.sub{color:var(--muted);font-size:15px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--p);color:var(--pt);border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.badge.red{background:var(--dangerbg);color:var(--danger)}
.badge.acc{background:var(--acc);color:var(--acct)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;background:color-mix(in srgb,var(--p) 14%,var(--surface));color:color-mix(in srgb,var(--p) 78%,var(--ink))}
.alert{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--warnbg);color:var(--warn);font-size:14px;margin-bottom:12px}
.alert.red{background:var(--dangerbg);color:var(--danger)}
.alert.ok{background:var(--okbg);color:var(--ok)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .ic{margin-bottom:8px;opacity:.7}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* eventos */
.evc{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ec);border-radius:16px;padding:14px;margin-bottom:12px;min-height:84px}
.evc b{display:block;line-height:1.25}
.evc small{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;margin-top:2px}
.evc>div{flex:1;min-width:0}
.note{display:flex;gap:10px;color:var(--muted);font-size:14px;padding:8px 4px}

/* welcome */
.hero{background:linear-gradient(165deg,var(--p) 0%,color-mix(in srgb,var(--p) 78%,#000) 100%);color:var(--pt);padding:18px 20px 30px;position:relative;overflow:hidden;flex:none}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--sec);opacity:.18}
.hero .top{display:flex;justify-content:space-between;margin-bottom:22px;position:relative;z-index:1}
.hero h1{font-size:26px;line-height:1.15;margin:16px 0 8px;position:relative;z-index:1}
.hero p{opacity:.92;display:flex;gap:6px;align-items:center;font-size:14px;margin-top:4px;position:relative;z-index:1}
.hero .ibtn,.hero .btn.ghost{color:var(--pt)}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.install{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px dashed color-mix(in srgb,var(--p) 55%,var(--line));border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}
.install b{display:block}

/* programação */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 10px;padding:0 16px 4px;scrollbar-width:none}
.day{flex:1 0 74px;min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.day b{font-size:20px;color:var(--ink);line-height:1.1}
.day.on{background:var(--p);color:var(--pt);border-color:transparent}
.day.on b{color:var(--pt)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:color-mix(in srgb,var(--p) 16%,var(--surface));border-color:var(--p);color:color-mix(in srgb,var(--p) 78%,var(--ink))}
.slot{font-size:14px;font-weight:700;color:var(--muted);margin:14px 0 8px;display:flex;align-items:center;gap:10px}
.slot::after{content:"";flex:1;height:1px;background:var(--line)}
.count{font-size:14px;color:var(--muted);margin:4px 0 8px}
.tc{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.tc-main{flex:1;min-width:0}
.tc.canc{background:color-mix(in srgb,var(--danger) 6%,var(--surface))}
.tc.canc h4{text-decoration:line-through;text-decoration-color:var(--danger);color:var(--muted)}
.tc-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-bottom:6px;align-items:center}
.tc-meta span{display:inline-flex;align-items:center;gap:4px}
.tc h4{font-size:16px;line-height:1.3;margin-bottom:6px}
.au{font-size:13px;color:var(--muted);margin-bottom:8px}
.au b{color:var(--ink)}
.add{width:46px;height:46px;border-radius:50%;flex:none;border:2px solid var(--p);background:var(--surface);color:color-mix(in srgb,var(--p) 78%,var(--ink));display:flex;align-items:center;justify-content:center}
.add.on{background:var(--p);color:var(--pt)}
.add[disabled]{opacity:.35;cursor:not-allowed}

/* busca */
.sbox{position:relative;margin-bottom:10px}
.sbox .ic{position:absolute;left:14px;top:14px;color:var(--muted)}
.sbox input{padding-left:44px}
input,select,textarea{width:100%;min-height:46px;border:1px solid color-mix(in srgb,var(--muted) 45%,var(--line));border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}
textarea{min-height:96px;resize:vertical}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--p)}
input[type=color]{padding:3px;min-height:46px}
.f{margin-bottom:14px}
.f label,.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.f small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.f .err{color:var(--danger);font-weight:600}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;margin-bottom:12px}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw button{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}

/* detalhe */
.dt h2{font-size:21px;line-height:1.25;margin:10px 0 12px}
.info{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.info div{display:flex;align-items:center;gap:10px;font-size:15px}
.info .ic{color:color-mix(in srgb,var(--p) 78%,var(--ink))}
.sec-t{font-size:14px;font-weight:700;margin:18px 0 8px}
.aut{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.aut:last-child{border:0}
.av{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--p) 18%,var(--surface));color:color-mix(in srgb,var(--p) 80%,var(--ink));font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.aut>div{flex:1;min-width:0}
.aut b{display:block;font-size:15px}
.aut small{color:var(--muted);font-size:13px}
.aut .bs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;min-height:56px}
.row:last-child{border-bottom:0}
.row>div{flex:1;min-width:0}
.row b{display:block;font-size:15px}
.row small{color:var(--muted);font-size:13px}
.row.dg{color:var(--danger)}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;min-height:0}
.sw span{position:absolute;inset:0;border-radius:15px;background:color-mix(in srgb,var(--muted) 45%,var(--line));transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--p)}
.sw input:checked+span::after{transform:translateX(22px)}
.sw input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}

/* agenda */
.ag-day{font-size:15px;font-weight:700;margin:16px 0 8px;text-transform:none}
.ag{display:flex;gap:12px;margin-bottom:10px}
.ag .tm{width:52px;flex:none;text-align:right;font-weight:700;font-size:15px;padding-top:12px}
.ag .tm small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.ag .tc{flex:1;margin:0;border-left:5px solid var(--p)}
.ag .tc.canc{border-left-color:var(--danger)}
.ag .tc.cf{border-left-color:var(--acc)}
.mini{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mini .btn{min-height:38px}

/* sobreposições */
.ov{position:absolute;inset:0;z-index:40;background:rgba(8,10,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-height:88%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:19px;margin-bottom:8px}
.sheet p{color:var(--muted);font-size:15px;margin-bottom:12px}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sheet h4{font-size:14px;margin:14px 0 4px}
.sheet .pol p{font-size:14px;margin-bottom:6px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:50;background:#151a22;color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.3);text-align:center}
.pushn{position:absolute;left:10px;right:10px;top:10px;z-index:60;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:left;animation:down .25s ease-out;width:calc(100% - 20px)}
@keyframes down{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.pushn small{color:var(--muted);font-size:12px;display:block}
.pushn b{display:block;font-size:14px;line-height:1.25}
.pushn span{font-size:13px;color:var(--muted)}

/* ---------- Admin ---------- */
.adm{width:100%;height:100%}
@media (min-width:900px){.adm{width:min(1120px,100%);height:min(800px,100%);border-radius:16px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.3)}}
.adm-top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.adm-top b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-top select{width:auto;max-width:46%;min-height:42px}
.adm-body{flex:1;min-height:0;display:flex;flex-direction:column}
.adm-nav{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.adm-nav button{flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:none;display:inline-flex;gap:8px;align-items:center;font-weight:600;color:var(--muted)}
.adm-nav button.on{background:color-mix(in srgb,var(--p) 14%,var(--surface));color:color-mix(in srgb,var(--p) 78%,var(--ink))}
.adm-main{flex:1;min-height:0;overflow:auto;padding:16px}
@media (min-width:900px){
  .adm-body{flex-direction:row}
  .adm-nav{flex-direction:column;width:210px;overflow:visible;border-bottom:0;border-right:1px solid var(--line);padding:14px 10px}
  .adm-nav button{width:100%}
  .adm-main{padding:22px}
}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{font-size:22px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:14px}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.two{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--p);min-width:6px}
.bar span:first-child{width:70px;flex:none;color:var(--muted)}
.li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;flex-wrap:wrap}
.li>div:first-child{flex:1;min-width:200px}
.li b{display:block;line-height:1.3;margin-bottom:4px}
.li small{color:var(--muted);font-size:13px}
.li .acts{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:grid;gap:10px;margin-bottom:12px}
@media (min-width:700px){.filters{grid-template-columns:2fr 1fr 1fr}}
.autbox{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--bg)}
.autbox .rr{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.autbox .rr label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;margin:0;min-height:36px}
.pv{border-radius:22px;border:6px solid #0a0c10;overflow:hidden;background:var(--bg);max-width:300px;margin:0 auto}
.pv .h{display:flex;gap:10px;align-items:center;padding:12px}
.pv .b{padding:12px}
.qr{display:block;margin:8px auto;border-radius:8px;background:#fff;padding:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.scroll-x{overflow-x:auto}
.login{margin:auto;width:min(380px,100%);padding:20px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= Dados de exemplo ================= */
const A=(nome,inst,p=0,a=0)=>({nome,inst,primeiro:!!p,apresenta:!!a});
function seed(){
  const W=(id,evento,gt,titulo,kw,dia,hora,sala,autores,status='agendado')=>({id,evento,gt,titulo,kw,dia,hora,sala,autores,status,
    resumo:'Resumo de exemplo: pesquisa de abordagem qualitativa que analisa o tema “'+titulo+'”, com coleta de dados em instituições da região e discussão dos resultados à luz da literatura. Os achados apontam desafios e caminhos para a prática profissional e para as políticas públicas.'});

function lum(h){const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function textOn(h){return ratio(h,'#ffffff')>=ratio(h,'#111111')?'#ffffff':'#111111'}
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
function dp(d){const [y,m,dd]=d.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,dd));return{wd:WD[t.getUTCDay()],dd:String(dd).padStart(2,'0'),mm:String(m).padStart(2,'0'),y}}
const dlong=d=>{const p=dp(d);return `${p.wd}, ${p.dd}/${p.mm}/${p.y}`};
const dshort=d=>{const p=dp(d);return `${p.wd}, ${p.dd}/${p.mm}`};
const rng=e=>`${dp(e.ini).dd}/${dp(e.ini).mm} a ${dp(e.fim).dd}/${dp(e.fim).mm}/${dp(e.fim).y}`;

}

function searchResults(){
  const q=norm(S.q.trim());const m=S.smode;
  if(!q){
    const cnt={};evTr().forEach(t=>t.kw.forEach(k=>cnt[k]=(cnt[k]||0)+1));
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
    return `<p class="lbl" style="margin-top:8px">Palavras-chave mais buscadas</p><div class="kw">${top.map(k=>`<button data-act="kwsearch" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div>`;
  }
  const res=evTr().filter(t=>{
    const inT=norm(t.titulo).includes(q),inA=t.autores.some(a=>norm(a.nome).includes(q)),inK=t.kw.some(k=>norm(k).includes(q));
    return m==='titulo'?inT:m==='autor'?inA:m==='kw'?inK:(inT||inA||inK);
  }).sort(sortT);
  return `<p class="count" aria-live="polite">${res.length} resultado${res.length===1?'':'s'}</p>`+
    (res.length?res.map(t=>card(t,true)).join(''):`<div class="empty">${icon('search',36)}<b>Nenhum trabalho encontrado</b>Revise a grafia ou tente outro tipo de busca.<br><button class="btn" data-act="smode" data-m="tudo">Buscar em tudo</button></div>`);
}

function slugify(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function qr(seed){const n=21;let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const rnd=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296};
  let r='';const fp=(x,y)=>x<8&&y<8||x>n-9&&y<8||x<8&&y>n-9;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on;if(fp(x,y)){const lx=x%(n-7>x?100:1),ax=x<8?x:x-(n-7),ay=y<8?y:y-(n-7);on=(ax===0||ax===6||ay===0||ay===6||(ax>=2&&ax<=4&&ay>=2&&ay<=4))&&ax<=6&&ay<=6&&ax>=0&&ay>=0}else on=rnd()>.5;if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg class="qr" width="132" height="132" viewBox="-1 -1 23 23" role="img" aria-label="QR Code ilustrativo" fill="#111">${r}</svg>`}

/* ================= Render ================= */
let lastKey='';
function render(){
  applyTheme();
  const old=$('.view');const top=old?old.scrollTop:0;
  const key=S.mode+(S.mode==='part'?cur().name+JSON.stringify(cur().params||{}):S.apage);
  const shell=S.mode==='admin'?admShell():phoneShell();
  $('#app').innerHTML=`<div class="stage"><aside class="guide">${guideHTML()}</aside><div class="main">${shell}</div><button class="fab" data-act="guide" aria-label="Abrir guia do protótipo">${icon('sliders',22)}</button></div>`;
  const nv=$('.view');if(nv&&key===lastKey)nv.scrollTop=top;lastKey=key;
}

 guide(){openSheet(guideHTML())},

  const n=$('#r-nome').value.trim(),m=$('#r-email').value.trim(),i=$('#r-inst').value.trim();const errs=[];

  const wantPush=$('#r-push').checked;
  S.user=S.user||{nome:n,email:m,inst:i,eventos:[]};S.user.nome=n;S.user.email=m;S.user.inst=i;if(!S.user.eventos.includes(S.eventId))S.user.eventos.push(S.eventId);
  if(wantPush){S.push=true;S.pushAsked=true}
  S.stack=[{name:'program'}];render();toast('Cadastro concluído. Já pode montar sua agenda.');
 },
 'do-login'(){const m=$('#r-email').value.trim();if(!/^\S+@\S+\.\S+$/.test(m)){$('#regerr').innerHTML=`<div class="alert red" role="alert">${icon('alert')}<div>Informe um e-mail válido.</div></div>`;return}
  S.user=S.user||{nome:'Maria Silva',email:m,inst:'UFAM',eventos:[]};if(!S.user.eventos.includes(S.eventId))S.user.eventos.push(S.eventId);
  S.stack=[{name:'program'}];render();toast('Link de acesso enviado. No protótipo, você já entrou.')},

 gt(el){S.gt=el.dataset.g;render()},

 install(){installSheet()},

 toggle(el){const id=+el.dataset.id,t=TR(id);

    if(!S.pushAsked){S.pushAsked=true;setTimeout(pushSheet,900)}}},

  if(!it){if(S.stack[0].name==='events')S.stack=[{name:'program'}];render();toast('Adicione um trabalho à agenda para simular o cancelamento.');return}
  it.status='cancelado';render();pushNote('Apresentação cancelada',it.titulo,it.id)},
 reset(){D=seed();S.agenda={};S.sheet=null;S.user=null;S.stack=[{name:'events'}];S.eventId=null;S.pushAsked=false;S.push=false;S.banner=true;render();toast('Dados de exemplo restaurados')},

 /* admin */
 'adm-login'(){S.adm=true;S.apage='dash';render()},
 'adm-logout'(){S.adm=false;render()},
 'adm-nav'(el){S.apage=el.dataset.p;S.err=[];render()},
 'ev-new'(){S.ed={id:null,nome:'',sigla:'',slug:'',local:'',ini:'2027-05-10',fim:'2027-05-12',cp:'#6A3FB5',cs:'#E9DFF8',cd:'#F0A202',logoUrl:''};S.err=[];S.apage='evento-form';render()},
 'ev-edit'(el){S.ed={...D.eventos.find(e=>e.id===el.dataset.id)};S.err=[];S.apage='evento-form';render()},
 'logo-file'(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.ed.logoUrl=r.result;render()};r.readAsDataURL(f)},
 'logo-del'(){S.ed.logoUrl='';render()},
 'ev-save'(){const d=S.ed;const er=[];if(!d.nome.trim())er.push('Informe o nome do evento.');
  if(!d.slug.trim())d.slug=slugify(d.nome);if(D.eventos.some(e=>e.slug===d.slug&&e.id!==d.id))er.push('Este endereço já é usado por outro evento.');
  if(!d.ini||!d.fim||d.fim<d.ini)er.push('Confira as datas: o término não pode ser antes do início.');
  if(!d.sigla.trim())d.sigla=d.nome.split(' ').filter(w=>w.length>2).map(w=>w[0]).join('').slice(0,4).toUpperCase()||'EV';
  S.err=er;if(er.length){render();$('.view').scrollTop=0;return}
  if(d.id){const i=D.eventos.findIndex(e=>e.id===d.id);D.eventos[i]={...D.eventos[i],...d}}else{d.id='e'+(D.eventos.length+1+Date.now()%1000);d.insc=0;D.eventos.push({...d});S.aev=d.id}
  S.apage='eventos';render();toast('Evento salvo')},
 'gt-new'(){gtSheet(null)},'gt-edit'(el){gtSheet(el.dataset.id)},
 'gt-save'(){const s=$('#g-sigla').value.trim(),n=$('#g-nome').value.trim();if(!s||!n){$('#gerr').innerHTML=`<div class="alert red" role="alert">${icon('alert')}<div>Informe a sigla e o nome do GT.</div></div>`;return}
  const v={sigla:s,nome:n,coord:$('#g-coord').value.trim(),desc:$('#g-desc').value.trim()};
  if(S.gtEdit)Object.assign(D.gts.find(g=>g.id===S.gtEdit),v);else D.gts.push({id:'g'+Date.now(),evento:S.aev,...v});
  S.sheet=null;render();toast('GT salvo')},
 'gt-del'(el){const g=D.gts.find(x=>x.id===el.dataset.id);const n=D.trabalhos.filter(t=>t.gt===g.id).length;
  if(n){openSheet(`<h3>Não é possível excluir</h3><p>O ${esc(g.sigla)} tem ${n} trabalho(s). Mude esses trabalhos para outro GT e tente de novo.</p><div class="acts"><button class="btn pri" data-act="close">Entendi</button></div>`);return}
  confirmSheet('Excluir GT?',`O ${esc(g.sigla)} · ${esc(g.nome)} será removido.`,'Excluir GT',()=>{D.gts=D.gts.filter(x=>x.id!==g.id);render();toast('GT excluído')})},
 'tr-new'(){S.td={id:null,titulo:'',resumo:'',kw:'',gt:'',dia:'',hora:'09:00',sala:'',status:'agendado',aut:[{nome:'',inst:'',primeiro:true,apresenta:true}]};S.err=[];S.apage='trab-form';render()},
 'tr-edit'(el){const t=TR(el.dataset.id);S.td={id:t.id,titulo:t.titulo,resumo:t.resumo,kw:t.kw.join(', '),gt:t.gt,dia:t.dia,hora:t.hora,sala:t.sala,status:t.status,aut:t.autores.map(a=>({...a}))};S.err=[];S.apage='trab-form';render()},
 'aut-add'(){S.td.aut.push({nome:'',inst:'',primeiro:false,apresenta:false});render()},
 'aut-del'(el){const i=+el.dataset.i;const [r]=S.td.aut.splice(i,1);if(r.primeiro)S.td.aut[0].primeiro=true;if(r.apresenta)S.td.aut[0].apresenta=true;render()},
 'tr-save'(){const d=S.td,er=[];
  if(!d.titulo.trim())er.push('Informe o título do trabalho.');if(!d.gt)er.push('Escolha o GT.');if(!d.dia)er.push('Escolha a data da apresentação.');if(!d.hora)er.push('Informe a hora de início.');if(!d.sala.trim())er.push('Informe a sala.');
  if(d.aut.some(a=>!a.nome.trim()))er.push('Preencha o nome de todos os autores ou remova a linha vazia.');
  if(!d.aut.some(a=>a.primeiro))er.push('Marque o 1º autor.');if(!d.aut.some(a=>a.apresenta))er.push('Marque quem apresenta o trabalho.');
  if(d.dia&&d.hora&&d.sala){const c=D.trabalhos.find(t=>t.evento===S.aev&&t.id!==d.id&&!cancelled(t)&&t.dia===d.dia&&norm(t.sala)===norm(d.sala)&&mins(t.hora)<mins(d.hora)+20&&mins(d.hora)<mins(t.hora)+20);if(c)er.push(`A ${d.sala} já está ocupada nesse horário por “${c.titulo}”.`)}
  S.err=er;if(er.length){render();$('.view').scrollTop=0;return}
  const v={titulo:d.titulo.trim(),resumo:d.resumo.trim()||'Resumo não informado.',kw:d.kw.split(',').map(s=>s.trim()).filter(Boolean),gt:d.gt,dia:d.dia,hora:d.hora,sala:d.sala.trim(),status:d.status,autores:d.aut.map(a=>({nome:a.nome.trim(),inst:a.inst.trim(),primeiro:a.primeiro,apresenta:a.apresenta}))};
  if(d.id)Object.assign(TR(d.id),v);else D.trabalhos.push({id:Math.max(...D.trabalhos.map(t=>t.id))+1,evento:S.aev,...v});
  S.apage='trabalhos';render();toast('Trabalho salvo')},
 'tr-cancel'(el){const t=TR(el.dataset.id);const n=(t.id*7)%38+3;confirmSheet('Cancelar a apresentação?',`“${esc(t.titulo)}” continua no programa, com o selo Cancelado. ${n} participantes que o têm na agenda serão avisados.`,'Cancelar apresentação',()=>{t.status='cancelado';render();toast(`Cancelada. ${n} participantes avisados.`)})},
 'tr-react'(el){const t=TR(el.dataset.id);t.status='agendado';render();toast('Apresentação reativada')},
 'tr-del'(el){const t=TR(el.dataset.id);confirmSheet('Excluir o trabalho?','Ele será removido do programa e das agendas. Para manter o registro, prefira cancelar a apresentação.','Excluir trabalho',()=>{D.trabalhos=D.trabalhos.filter(x=>x.id!==t.id);render();toast('Trabalho excluído')})},
 'adm-export'(){toast('Arquivo CSV gerado (simulado)')}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='INPUT'&&(el.type==='checkbox'||el.type==='file'))return; // tratados em "change"
  if(el.dataset.act==='open'&&e.target.closest('label,.sw'))return;
  const f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.act&&(el.type==='checkbox'||el.type==='file')){const f=ACT[el.dataset.act];if(f)f(el,e);return}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('article[role=button]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){S.q=el.value;$('#results').innerHTML=searchResults();return}
  if(el.id==='aq'){S.aq=el.value;$('#alist').innerHTML=adminList();return}
  if(el.dataset.flt){const k=el.dataset.flt;if(k==='aev'){S.aev=el.value;S.agt='all';S.err=[]}else S[k]=el.value;render();return}
  if(S.ed&&el.dataset.f){S.ed[el.dataset.f]=el.value;if(el.dataset.f==='nome'&&!S.ed.id&&!S.ed._slugTouched){S.ed.slug=slugify(el.value);const s=$('#e-slug');if(s)s.value=S.ed.slug}
    if(el.dataset.f==='slug')S.ed._slugTouched=true;const pv=$('#evprev');if(pv)pv.innerHTML=evPreview();return}
  if(S.td&&el.dataset.t){S.td[el.dataset.t]=el.value;return}
  if(S.td&&el.dataset.ai!==undefined){const a=S.td.aut,i=+el.dataset.ai,f=el.dataset.af;
    if(f==='primeiro'||f==='apresenta'){a.forEach((x,j)=>x[f]=(j===i))}else a[i][f]=el.value}
});
render();
</script>
